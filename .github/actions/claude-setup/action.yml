name: claude-setup
description: Prepares a GitHub-hosted Ubuntu runner for the Claude jobs the same way ci.yml's checks job does, with a headless Wayland desktop, the Rust core built and app deps installed.
runs:
  using: composite
  steps:
    # The QA areas render and export a lot; on a stock runner the core and layers areas were killed mid-run
    # ("runner has received a shutdown signal"). Free the disk taken by toolchains nothing here uses, and add swap.
    - shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        if sudo fallocate -l 8G /mnt/claude-swap && sudo chmod 600 /mnt/claude-swap && sudo mkswap /mnt/claude-swap >/dev/null           && sudo swapon /mnt/claude-swap; then :; else echo "::warning::could not add swap"; fi
        df -h / /mnt; free -m
    # Headless Wayland desktop for the GUI checks (GPUIX's Linux build has no X11): sway + grim + lavapipe.
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends sway grim mesa-vulkan-drivers libvulkan1 \
          libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libfontconfig1 fonts-noto-core fonts-noto-color-emoji >/dev/null
    - uses: Swatinem/rust-cache@v2
      with: { workspaces: core }
    - uses: oven-sh/setup-bun@v2
      with: { bun-version: 1.4.3 }
    - shell: bash
      working-directory: core
      run: cargo build --release
    - shell: bash
      working-directory: app
      run: bun install --frozen-lockfile
