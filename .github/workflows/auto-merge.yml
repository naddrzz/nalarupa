name: auto-merge
# Merges PRs into dev once they pass the gate in .github/scripts/auto-merge.sh (green ci, cubic and CodeRabbit done,
# every bot thread resolved, mergeable). Runs every 15 minutes and whenever ci finishes; label a PR no-auto-merge
# to hold it. Merges as the repo owner (GH_PAT), so the merge triggers ci on dev like a manual one. Also reruns
# Claude jobs that an API error such as the usage limit ended (.github/scripts/retry-claude.sh).
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:

# One pass at a time; a newer trigger replaces a waiting one.
concurrency: { group: auto-merge, cancel-in-progress: false }
permissions: { contents: read }

jobs:
  auto-merge:
    # Its own small runner on the VPS: on the Claude runners it waited hours behind QA and fix jobs.
    runs-on: [self-hosted, nalarupa-light]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/scripts, persist-credentials: false }
      - run: bash .github/scripts/auto-merge.sh
        env: { GH_TOKEN: "${{ secrets.GH_PAT }}", GITHUB_REPOSITORY: "${{ github.repository }}" }

  # Same runner and cadence, with its own time budget: rerun Claude jobs that the usage limit (or another API error) ended.
  retry-claude:
    needs: auto-merge
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, nalarupa-light]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/scripts, persist-credentials: false }
      - run: bash .github/scripts/retry-claude.sh
        env: { GH_TOKEN: "${{ secrets.GH_PAT }}", GITHUB_REPOSITORY: "${{ github.repository }}" }
