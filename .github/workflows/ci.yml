name: ci
on:
  push: { branches: [dev, main] }
  pull_request:
  workflow_dispatch:

# One app instance at a time: the MCP server binds 127.0.0.1:47700.
concurrency: { group: nalarupa-vps, cancel-in-progress: false }

env:
  CARGO_TARGET_DIR: /home/nalarupa-ci/.cache/nalarupa-target
  NALARUPA_CORE: /home/nalarupa-ci/.cache/nalarupa-target/release/libnalarupa_core.so

jobs:
  checks:
    # The self-hosted runner never runs code from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nalarupa]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release && cargo test --release
        working-directory: core
      - run: bun install --frozen-lockfile && bun run typecheck && bun run smoke && bun run editor-check && bun run mcp-check && bun run doc-check
        working-directory: app
      - run: bash scripts/wl-run.sh bun run e2e && bash scripts/wl-run.sh bun run file-e2e
        working-directory: app
      # editor-e2e stops at the first text entry on Linux (GPUIX automation `fill` types nothing under
      # Wayland); run it on Windows until that is fixed.
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: app/screenshots/, retention-days: 7 }
