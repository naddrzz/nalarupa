name: ci
# GitHub-hosted runners: free for this public repo, a clean machine per job, and nothing from a fork PR touches the
# VPS. The Claude workflows run on them too; the VPS only runs auto-merge.
on:
  push: { branches: [dev, main] }
  pull_request:
  workflow_dispatch:

concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
# The jobs build and run third-party code (crates, npm): a read-only token, and none left in .git.
permissions: { contents: read }

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Every app check and GUI suite runs on the Go core built below.
    env: { NALARUPA_CORE: "${{ github.workspace }}/core-go/out/libnalarupa_core.so" }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      # Headless Wayland desktop for the GUI checks (GPUIX's Linux build has no X11): sway + grim + lavapipe;
      # poppler-utils rasterises and extracts the Go PDF parity files (core-go/pdf).
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sway grim mesa-vulkan-drivers libvulkan1 \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libfontconfig1 fonts-noto-core fonts-noto-color-emoji poppler-utils >/dev/null
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.3 }
      # The Rust core stays as the parity oracle: its CLI is what the Go parity tests compare with.
      - run: cargo build --release && cargo test --release
        working-directory: core
      # The Go core (one small module dependency, so no module cache); the parity tests run against the
      # CLI just built, the text ones live with the fonts installed above and a variable font (OFL Maven Pro, pinned).
      # cgo builds the vendored quickjs-ng (core-go/script/qjs) with the runner's gcc and links the pinned wgpu-native
      # (core-go/shader/gpu, fetched by go generate); its GPU tests run on lavapipe (mesa-vulkan-drivers above).
      # build.sh then builds the library the app loads (core-go/out).
      - uses: actions/setup-go@v5
        with: { go-version-file: core-go/go.mod, cache: false }
      - run: curl -fsSL -o "$NALARUPA_VARIABLE_FONT" 'https://raw.githubusercontent.com/google/fonts/cc39c4c2c304bc368c9b7c311ea2bcc6013299fe/ofl/mavenpro/MavenPro%5Bwght%5D.ttf' && go generate ./shader/gpu && go vet ./... && go test ./... && bash build.sh
        working-directory: core-go
        env: { CGO_ENABLED: "1", NALARUPA_CLI: "${{ github.workspace }}/core/target/release/nalarupa-cli", NALARUPA_VARIABLE_FONT: "${{ runner.temp }}/MavenPro.ttf" }
      - run: bun install --frozen-lockfile && bun run typecheck && bun run smoke && bun run editor-check && bun run mcp-check && bun run doc-check && bun run script-check && bun run chat-check && bun run mcp-install-check && bun run drag-check && bun run viewport-check && bun run issues-check && bun run layout-check && bun run text-check && bun run scriptnode-check && bun run shader-check && bun run paint-check && bun run component-check
        working-directory: app
      # Step timeouts: a hung suite fails its step, which claude-ci-fix picks up, instead of cancelling the job.
      - run: bash scripts/wl-run.sh bun run e2e
        timeout-minutes: 15
        working-directory: app
      - run: bash scripts/wl-run.sh bun run file-e2e
        timeout-minutes: 15
        working-directory: app
      - run: bash scripts/wl-run.sh bun run editor-e2e
        timeout-minutes: 15
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots-linux, path: app/screenshots/, retention-days: 7 }

  windows:
    # The release platform, and the only place a11y-check (UI Automation), window-check and exe-check can run.
    # No GPU on hosted runners: GPUI falls back to the WARP software rasterizer.
    runs-on: windows-latest
    # Required like checks: the merge gate waits for it, and a failure starts claude-ci-fix.
    timeout-minutes: 60
    defaults: { run: { shell: bash } }
    # Every app check and GUI suite runs on the Go core built below; the packaged exe steps clear it, so they load
    # the core copied next to dist/nalarupa.exe.
    env: { NALARUPA_CORE: "${{ github.workspace }}/core-go/out/nalarupa_core.dll" }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.3 }
      # The Rust core stays as the parity oracle: its CLI is what the Go parity tests compare with.
      - id: core
        run: cargo build --release && cargo test --release
        working-directory: core
      - uses: actions/setup-go@v5
        with: { go-version-file: core-go/go.mod, cache: false }
      # cgo builds the vendored quickjs-ng (core-go/script/qjs) with the image's MinGW-w64 gcc and links the pinned
      # wgpu-native MinGW build (core-go/shader/gpu, fetched by go generate); its GPU tests run on WARP. build.sh then
      # builds the dll the app loads (core-go/out).
      - id: core-go
        run: curl -fsSL -o "$NALARUPA_VARIABLE_FONT" 'https://raw.githubusercontent.com/google/fonts/cc39c4c2c304bc368c9b7c311ea2bcc6013299fe/ofl/mavenpro/MavenPro%5Bwght%5D.ttf' && go generate ./shader/gpu && go vet ./... && go test ./... && bash build.sh
        working-directory: core-go
        env: { CGO_ENABLED: "1", CC: "C:/mingw64/bin/gcc.exe", NALARUPA_CLI: "${{ github.workspace }}/core/target/release/nalarupa-cli.exe", NALARUPA_VARIABLE_FONT: "${{ runner.temp }}/MavenPro.ttf" }
      - id: app
        run: bun install --frozen-lockfile && bun run typecheck && bun run smoke && bun run editor-check && bun run mcp-check && bun run doc-check && bun run script-check && bun run chat-check && bun run drag-check && bun run viewport-check && bun run issues-check
        working-directory: app
      # The hosted desktop is 1024×768; the GUI suites assume the full 1440×900 window, as on a real screen.
      - id: display
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          $mode = Get-CimInstance Win32_VideoController | Select-Object CurrentHorizontalResolution, CurrentVerticalResolution
          $mode
          if (-not ($mode | Where-Object { $_.CurrentHorizontalResolution -eq 1920 -and $_.CurrentVerticalResolution -eq 1080 })) { throw 'Display resolution was not set to 1920x1080' }
      - run: bun run e2e
        working-directory: app
        timeout-minutes: 10
      # A GUI suite after a failed build waits for a core that never comes and times the whole job out. The display
      # step runs only after the core and app steps passed, so its success covers all three.
      - if: ${{ !cancelled() && steps.display.outcome == 'success' }}
        run: bun run editor-e2e
        working-directory: app
        timeout-minutes: 10
      - if: ${{ !cancelled() && steps.display.outcome == 'success' }}
        run: bun run file-e2e
        working-directory: app
        timeout-minutes: 10
      - if: ${{ !cancelled() && steps.display.outcome == 'success' }}
        run: bun run a11y-check
        working-directory: app
        timeout-minutes: 10
      - if: ${{ !cancelled() && steps.display.outcome == 'success' }}
        run: bun run motion-check
        working-directory: app
        timeout-minutes: 10
      - if: ${{ !cancelled() && steps.display.outcome == 'success' }}
        run: bun run window-check
        working-directory: app
        timeout-minutes: 10
      - if: ${{ !cancelled() && steps.display.outcome == 'success' }}
        run: bun run build && bun run exe-check
        working-directory: app
        env: { NALARUPA_CORE: "" }
        timeout-minutes: 10
      - if: ${{ !cancelled() && steps.display.outcome == 'success' }}
        run: bun run window-check dist/nalarupa.exe
        working-directory: app
        env: { NALARUPA_CORE: "" }
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots-windows, path: app/screenshots/, retention-days: 7 }
