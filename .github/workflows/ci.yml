name: ci
on:
  push: { branches: [dev, main] }
  pull_request:
  workflow_dispatch:

# CI has its own runner (label nalarupa-ci) so checks never wait behind long Claude jobs. Its .env sets
# CARGO_TARGET_DIR and NALARUPA_CORE to ~/.cache/ci-target, apart from the Claude runner's build.
jobs:
  checks:
    # The self-hosted runner never runs code from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nalarupa-ci]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release && cargo test --release
        working-directory: core
      - run: bun install --frozen-lockfile && bun run typecheck && bun run smoke && bun run editor-check && bun run mcp-check && bun run doc-check
        working-directory: app
      - run: bash scripts/wl-run.sh bun run e2e && bash scripts/wl-run.sh bun run file-e2e
        working-directory: app
      - run: bash scripts/wl-run.sh bun run editor-e2e
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: app/screenshots/, retention-days: 7 }
