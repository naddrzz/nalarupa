name: claude-ci-fix
# A failed ci run on a PR from this repo → Claude reads the log, fixes the cause and pushes to the PR branch
# (at most 3 rounds per PR). Runs as the repo owner through GH_PAT, so the push re-runs ci.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

env:
  CARGO_TARGET_DIR: /home/nalarupa-ci/.cache/nalarupa-target
  NALARUPA_CORE: /home/nalarupa-ci/.cache/nalarupa-target/release/libnalarupa_core.so
  GH_TOKEN: ${{ secrets.GH_PAT }}

jobs:
  fix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    concurrency: { group: "ci-fix-${{ github.event.workflow_run.head_branch }}", cancel-in-progress: false }
    runs-on: [self-hosted, nalarupa]
    timeout-minutes: 120
    permissions: { contents: write, pull-requests: write, actions: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_branch }}", fetch-depth: 0, token: "${{ secrets.GH_PAT }}" }
      - id: guard
        # Skip when the branch moved on since the failed run (a newer ci run decides) or after 3 fix rounds.
        run: |
          echo "stale=$([ "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}" ] && echo 0 || echo 1)" >> "$GITHUB_OUTPUT"
          echo "rounds=$(git log --oneline origin/dev..HEAD --grep '^Fix CI:' | wc -l)" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.stale == '0' && steps.guard.outputs.rounds < 3
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT }}
          bot_id: "129574549"
          bot_name: naddrzz
          settings: '{"includeCoAuthoredBy": false}'
          additional_permissions: |
            actions: read
          claude_args: --max-turns 150 --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
          prompt: |
            Nalarupa repo; follow AGENTS.md. ci failed on branch `${{ github.event.workflow_run.head_branch }}`
            (run ${{ github.event.workflow_run.id }}, commit ${{ github.event.workflow_run.head_sha }}), which is checked out.

            1. Read the failure: gh run view ${{ github.event.workflow_run.id }} -R ${{ github.repository }} --log-failed
            2. Reproduce it locally with the same command (core: cargo test --release; app checks from app/;
               GUI checks as `bash scripts/wl-run.sh bun run <check>`), find the root cause and fix it. Fix the code,
               not the check, unless the check itself is wrong; never skip or weaken a check to get green.
               If the failure is outside this repo's control (runner down, network), make no commit and explain.
            3. Run the full set before pushing: (cd core && cargo build --release && cargo test --release) && (cd app &&
               bun run typecheck && bun run smoke && bun run editor-check && bun run mcp-check && bun run doc-check &&
               bash scripts/wl-run.sh bun run e2e && bash scripts/wl-run.sh bun run file-e2e).
            4. Commit with a subject starting `Fix CI: ` (no Co-authored-by trailer) and `git push`.
            5. Comment on the PR (gh pr comment ${{ github.event.workflow_run.head_branch }} --body ...) with the cause and the fix.
            Do not open a new PR and do not reference issues the PR does not already reference.
