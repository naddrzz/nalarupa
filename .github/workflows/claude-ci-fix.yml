name: claude-ci-fix
# A failed ci run on a PR from this repo → Claude reads the log, fixes the cause and pushes to the PR branch
# (at most 3 rounds per PR). Runs as the repo owner through GH_PAT, so the push re-runs ci. GitHub-hosted runner.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

jobs:
  fix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    concurrency: { group: "ci-fix-${{ github.event.workflow_run.head_branch }}", cancel-in-progress: false }
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions: { contents: write, pull-requests: write, actions: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_branch }}", fetch-depth: 0, token: "${{ secrets.GH_PAT }}" }
      - id: guard
        # Skip when the branch moved on since the failed run (a newer ci run decides) or after 3 fix rounds (the first failure plus one per round, counted from ci runs, not from commit subjects).
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          echo "stale=$([ "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}" ] && echo 0 || echo 1)" >> "$GITHUB_OUTPUT"
          echo "failures=$(gh run list -R ${{ github.repository }} -w ci.yml -b '${{ github.event.workflow_run.head_branch }}' -e pull_request -s failure -L 100 --json databaseId -q length)" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.stale == '0' && steps.guard.outputs.failures <= 3
        uses: ./.github/actions/claude-setup
      - if: steps.guard.outputs.stale == '0' && steps.guard.outputs.failures <= 3
        uses: anthropics/claude-code-action@v1
        env: { GH_TOKEN: "${{ secrets.GH_PAT }}" }
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Shows what Claude did (and why it stopped) on the run page.
          display_report: true
          github_token: ${{ secrets.GH_PAT }}
          bot_id: "129574549"
          bot_name: naddrzz
          # Claude Code ends its session while a background command still runs: keep commands in the foreground, with
          # room for long checks. These must sit in settings.env to reach Claude Code.
          settings: '{"includeCoAuthoredBy": false, "fastMode": false, "env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1", "BASH_DEFAULT_TIMEOUT_MS": "3600000", "BASH_MAX_TIMEOUT_MS": "3600000"}}'
          additional_permissions: |
            actions: read
          claude_args: --model claude-sonnet-5-5 --effort high --max-turns 150 --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
          prompt: |
            Nalarupa repo; follow AGENTS.md. ci failed on branch `${{ github.event.workflow_run.head_branch }}`
            (run ${{ github.event.workflow_run.id }}, commit ${{ github.event.workflow_run.head_sha }}), which is checked out.

            1. Read the failure: gh run view ${{ github.event.workflow_run.id }} -R ${{ github.repository }} --log-failed
            2. Reproduce it locally with the same command (core: cargo test --release; app checks from app/;
               GUI checks as `bash scripts/wl-run.sh bun run <check>`), find the root cause and fix it. Fix the code,
               not the check, unless the check itself is wrong; never skip or weaken a check to get green.
               If the failure is outside this repo's control (runner down, network), make no commit and explain.
            3. Run the full set before pushing: (cd core && cargo build --release && cargo test --release) && (cd app &&
               bun run typecheck && bun run smoke && bun run editor-check && bun run mcp-check && bun run doc-check &&
               bash scripts/wl-run.sh bun run e2e && bash scripts/wl-run.sh bun run file-e2e && bash scripts/wl-run.sh bun run editor-e2e).
            4. Commit with a subject starting `Fix CI: ` (no Co-authored-by trailer) and `git push`.
            5. Comment on the PR (gh pr comment ${{ github.event.workflow_run.head_branch }} --body ...) with the cause and the fix.
            Do not open a new PR and do not reference issues the PR does not already reference.
