name: claude-qa
# Nightly deep QA in nine areas plus new checks (tests job), one Claude session each. Every reproducible bug becomes an issue labeled
# "bug" + "claude", which hands it to the claude workflow: it fixes the bug and opens a PR with "Fixes #N".
on:
  schedule: [{ cron: "0 18 * * *" }] # 01:00 WIB
  # A change to this file runs the full QA once on dev, so a new or changed area is tried right away.
  push: { branches: [dev], paths: [.github/workflows/claude-qa.yml] }
  workflow_dispatch:
    inputs:
      areas:
        description: "Comma-separated areas to run (checks,core,layers,editor,canvas-motion,motion,agent,chat,design,tests); empty = all"
        required: false

# A manual run and the nightly one never interleave on the single runner.
concurrency: { group: claude-qa, cancel-in-progress: false }

env:
  CARGO_TARGET_DIR: /home/nalarupa-ci/.cache/nalarupa-target
  NALARUPA_CORE: /home/nalarupa-ci/.cache/nalarupa-target/release/libnalarupa_core.so
  # The in-app agent runs the `claude` CLI (Claude Code backend); this logs it in.
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

jobs:
  qa:
    strategy:
      fail-fast: false
      max-parallel: 1 # one runner, and every area opens windows
      matrix:
        include:
          - area: checks
            focus: |
              Run every automated check and turn each failure into an issue.
              - core: cd core && cargo test --release
              - headless: cd app; bun run typecheck; bun run smoke; bun run editor-check; bun run mcp-check; bun run doc-check
              - window (one at a time): bash scripts/wl-run.sh bun run <e2e | editor-e2e | file-e2e | motion-check>
              - real agent turns (Claude Code backend): bun run agent-check, bun run model-check, bash scripts/wl-run.sh bun scripts/agent-e2e.ts
              Rerun a failure once to separate flakes from bugs; a flake that reproduces in 2 of 5 runs is a bug too (say so).
          - area: core
            focus: |
              Deep-dive the Rust core through FFI (app/src/core.ts `call`) and MCP: document model, layout (auto layout,
              hug/fill, wrap, gaps, padding, nested frames), text (unicode, RTL, emoji, long words, line breaking),
              components/refs/variables/themes, undo/redo chains, execute() sandbox (core/guide/execute.md: every API,
              invalid input, timeouts, rollback), import of .pen files, exports (png/jpg/webp/svg/pdf/html) and their
              fidelity against the canvas render. Compare render output pixels where it matters.
          - area: editor
            focus: |
              Drive the real window and use the editor like a designer would: every toolbar tool (move, frame, rectangle,
              ellipse, text, pen, hand), drawing, selecting, marquee, resize/rotate/flip handles, snapping and guides,
              Alt-measure, group/ungroup, auto layout, the Layers panel (expand, rename, drag, keyboard tree), the
              Inspector (every field, scrubbing, arrow keys, colors, effects), Slides panel, Present mode, zoom/pan,
              keyboard shortcuts, undo/redo across all of these, Save/Recent/reopen. Look at every screenshot you take.
          - area: layers
            focus: |
              The canvas, layer by layer. Build documents through FFI/MCP that cover every node type (frame, group,
              rectangle, ellipse, line, path, text, image, component, instance/ref) and every visual property (solid,
              linear/radial/angular gradient and image fills, multiple fills, strokes with width/align/dash, corner radii,
              opacity, blend modes, shadows/blur effects, rotation, flip, clip content, auto layout child sizing, variables
              and themes). For each layer: render it alone with `renderPixels(..., solo=<id>)` from app/src/core.ts (solo draws
              top-level nodes only; check nested layers inside their top-level ancestor's solo render), render the whole scene,
              export it (png/svg/pdf/html), and compare the pixels against what the properties say it should look like and
              against each other (solo vs scene vs export). Then check layer order operations (front/back/up/
              down, reparent, wrap/unwrap, group/ungroup), hidden layers, nested clipping and deep nesting, and that each
              stays correct after undo/redo and after save → open. Read the rendered PNGs and look at them.
          - area: canvas-motion
            focus: |
              Animations on the canvas, frame by frame. Agent inserts slide into place (engine slide_in, ~0.6 s, then
              settle back into the cached view; `state().animating`), sibling glides, agent cursors gliding to touched
              nodes with name pills, flashes on touched nodes, the "generating" glow on placeholder frames, the shimmer on
              pending images (`live` command), zoom/pan/fit transitions, and that the canvas stops animating and repaints
              cleanly afterwards (no ghost frames, no stale cached view, no layer drawn twice). Capture bursts of frames:
              headless with `renderPixels` at known times, and in the window with `grim` in quick succession. Read them in
              order. Repeat everything with NALARUPA_REDUCED_MOTION=1: nothing may move, everything must still land in its
              final state. app/scripts/motion-check.ts and app/scripts/smoke.ts show how the animations are driven.
          - area: motion
            focus: |
              Animations in the app UI (AgentLayer.tsx, Agent.tsx, Present.tsx, ui.tsx): the typewriter reveal and animated
              ellipsis in chat replies, running dots, message pills (3 s), cursor fade-in/out, toasts appearing and leaving,
              hover/press/focus transitions, panel and tab switches, Present slide changes. Check timing and easing look
              right in frame bursts (`grim` in quick succession), that nothing stutters, jumps, flickers or keeps animating
              after it should stop (CPU idle afterwards), and that under NALARUPA_REDUCED_MOTION=1 every one of them is still
              (text appears whole, dots stay still) without losing any information.
          - area: agent
            focus: |
              The built-in agent's features, through the real window and the core: runs from design prompts of different
              kinds (landing page, mobile screen, slide deck, edit the selection, follow-up changes in the same chat),
              parallel agents (2×/3×/4×, split and side-by-side modes), "Let it cook" variations (designs > 1, iterate by
              layout and by style), the model picker and fast mode, Stop at different moments (thinking, mid-execute,
              between variations, while prompts are queued), new conversation and document switches while running (must be
              refused), external agents editing over MCP at the same time, permission prompts (allow, deny, stop while
              asked), edits landing on the canvas as one undoable step each, and attribution. Judge the produced designs
              from screenshots: broken layout, overflowing or clipped text, overlaps, unreadable contrast, empty frames.
              Keep each prompt small (2–3 execute calls) to bound time.
          - area: chat
            focus: |
              The agent chat panel itself: the composer (multi-line, Enter vs Shift+Enter, long prompts, unicode/emoji,
              paste, sending while running → queued bubble), streaming text and thinking, tool cards (execute progress,
              results, screenshots shown inline, errors), markdown rendering (code blocks, lists, links, tables), the
              history list (new, reopen, delete with confirm, a vanished chat file), restoring a chat after restart,
              error cards (one per failure, with a way out), the settings panel (backend, model, fast, API key masking),
              scrolling and long conversations, and keyboard access. Check what is saved to disk matches what was shown.
          - area: design
            focus: |
              Review Nalarupa's own interface for quality, from screenshots of every screen and state (Home, Editor
              panels, Inspector sections, Agent chat, Slides, Present, toasts, empty and error states, long names,
              many layers): visual bugs (misalignment, clipping, overflow, inconsistent spacing or radius, wrong
              colors in states), interaction bugs (hover/focus/active states, focus order with Tab, keyboard access),
              accessibility (every control has a name in the automation tree, focus visible, contrast WCAG AA),
              and copy (unclear labels, typos). Only real defects; no taste-only opinions.
    name: qa (${{ matrix.area }})
    runs-on: [self-hosted, nalarupa]
    timeout-minutes: 150
    permissions: { contents: read, issues: write, id-token: write }
    steps:
      # workflow_dispatch can pick areas; matrix values are not available in a job-level `if`. Whole names are matched,
      # because "motion" is a substring of "canvas-motion"; spaces are ignored, so "checks,tests" and "checks, tests" both work.
      - id: pick
        env: { AREAS: "${{ github.event.inputs.areas }}", AREA: "${{ matrix.area }}" }
        run: |
          areas=",$(tr -d ' ' <<< "$AREAS"),"
          if [ "$areas" = ",," ] || [[ "$areas" == *",$AREA,"* ]]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.pick.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.pick.outputs.run == 'true'
        run: cargo build --release
        working-directory: core
      - if: steps.pick.outputs.run == 'true'
        run: bun install --frozen-lockfile
        working-directory: app
      - if: steps.pick.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        env: { GH_TOKEN: "${{ secrets.GH_PAT }}" }
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The owner's token: issues it labels "claude" start the claude workflow (GITHUB_TOKEN events don't).
          github_token: ${{ secrets.GH_PAT }}
          settings: '{"includeCoAuthoredBy": false, "fastMode": false}'
          claude_args: --model claude-sonnet-5-5 --effort high --max-turns 300 --allowedTools "Bash,Read,Glob,Grep,Write,Edit"
          prompt: |
            You are the nightly QA for Nalarupa (repo ${{ github.repository }}, branch ${{ github.ref_name }}), area: ${{ matrix.area }}.
            Read AGENTS.md and README.md (Checks) first. The Rust core is built (NALARUPA_CORE points at it) and app deps are installed.

            ## Your area
            ${{ matrix.focus }}

            ## How to test on this machine
            - Throwaway scripts go in app/.qa/ (gitignored) so they can import from app/node_modules; never edit tracked files.
            - Headless: `import { call } from '../src/core'` and drive commands (see core/src/lib.rs `dispatch` for all of them).
              A script that needs a fresh data folder must rerun itself with NALARUPA_DATA set (see app/scripts/doc-check.ts).
            - Window: GPUIX automation (`launch` from '@gpuix/react/automation', as in app/scripts/e2e.ts and editor-e2e.ts),
              run as `bash scripts/wl-run.sh bun .qa/<file>.ts` from app/. Pass NALARUPA_DATA (a mkdtemp folder) in launch env.
              Find testIds with grep in app/src. Screenshots: `grim <path>.png` (GPUIX screenshot() does not work on Linux);
              Read every screenshot you take and look at it.
            - GPUIX limits (AGENTS.md): waitFor needs exactly one match, chords use hyphens, input values can't be read.
              A problem caused only by the automation or the headless compositor is not a product bug.
            - The MCP port is whatever `init` returns (another instance may hold 47700).

            ## Filing
            For each real, reproducible product bug:
            1. Search first: `gh issue list --state all --search "<keywords>"`; if an open issue covers it, comment new evidence there instead.
            2. Otherwise `gh issue create --label bug --label claude --title "[qa/${{ matrix.area }}] <short>" --body ...`
               with: steps to reproduce (a minimal script in a code block when possible), expected, actual, environment
               (Linux VPS, headless sway, lavapipe), and how often it reproduces. The "claude" label makes the claude
               workflow fix it and open a PR, so the repro must be precise.
            At most 6 new issues per area per night, most severe first. Nothing for style opinions, Windows-only behavior,
            or things you could not reproduce. Do not commit, push or open PRs.
            End with a summary: what you covered, what you could not, and the issues you filed or updated.
      - if: always() && steps.pick.outputs.run == 'true'
        run: rm -rf app/.qa

  # New automated checks for features nothing covers yet, written with the bmad-qa-generate-e2e-tests skill
  # (installed for the runner user; _bmad/custom/bmad-qa-generate-e2e-tests.toml holds this repo's conventions).
  # Passing checks go to one PR; a check that exposes a product bug becomes a "claude" issue instead.
  tests:
    if: always() && (github.event.inputs.areas == '' || contains(github.event.inputs.areas, 'tests'))
    needs: qa
    runs-on: [self-hosted, nalarupa]
    timeout-minutes: 150
    permissions: { contents: write, pull-requests: write, issues: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, token: "${{ secrets.GH_PAT }}" }
      - run: cargo build --release
        working-directory: core
      - run: bun install --frozen-lockfile
        working-directory: app
      - uses: anthropics/claude-code-action@v1
        env: { GH_TOKEN: "${{ secrets.GH_PAT }}" }
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT }}
          bot_id: "129574549"
          bot_name: naddrzz
          settings: '{"includeCoAuthoredBy": false, "fastMode": false}'
          claude_args: --model claude-sonnet-5-5 --effort high --max-turns 300 --allowedTools "Bash,Read,Glob,Grep,Write,Edit,Skill"
          prompt: |
            Run the bmad-qa-generate-e2e-tests skill for Nalarupa (repo ${{ github.repository }}, branch dev), unattended.
            Read AGENTS.md first. The core is built (NALARUPA_CORE points at it) and app deps are installed.
            - Nobody is there to answer the skill's questions. At "what to test", choose auto-discover. Pick at most 3
              features that no check in app/scripts/ exercises. Compare the commands in core/src/lib.rs `dispatch`, the
              MCP tools, and the UI flows in app/src against the existing checks, and prefer what breaks most often.
            - Write the checks the way the skill and _bmad/custom/bmad-qa-generate-e2e-tests.toml describe. Run each one 3 times
              (windowed checks under `bash scripts/wl-run.sh` from app/); keep only checks that pass all 3 times.
            - A check that fails because of a product bug, not the test: leave it out of the PR. File an issue
              (`gh issue create --label bug --label claude --title "[qa/tests] <short>"`) with the failing script as the repro,
              after searching for duplicates with `gh issue list --state all --search`. At most 3 new issues per run.
            - If you have passing checks: put them on a new branch `qa/tests-${{ github.run_id }}-${{ github.run_attempt }}` with their package.json
              scripts, the ci.yml step and the README line, plus the skill's summary. Run the full set first:
              (cd core && cargo test --release) && (cd app && bun run typecheck && bun run smoke && bun run editor-check &&
              bun run mcp-check && bun run doc-check). If any command fails, open no PR and report the failure in the summary. Commit with no Co-authored-by trailer, push, and open ONE PR against
              dev (`gh pr create --base dev`) titled "Add checks for <features>", with the summary as the body. Don't reference
              any issue, and don't add a "Generated with Claude Code" line.
            - Nothing new worth adding: open no PR, and say so.
      - if: always()
        run: rm -rf app/.qa
