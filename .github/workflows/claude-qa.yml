name: claude-qa
on:
  schedule: [{ cron: "0 19 * * *" }] # 02:00 WIB
  workflow_dispatch:

env:
  CARGO_TARGET_DIR: /home/nalarupa-ci/.cache/nalarupa-target
  NALARUPA_CORE: /home/nalarupa-ci/.cache/nalarupa-target/release/libnalarupa_core.so

jobs:
  qa:
    runs-on: [self-hosted, nalarupa]
    timeout-minutes: 90
    permissions: { contents: read, issues: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
        working-directory: core
      - run: bun install --frozen-lockfile
        working-directory: app
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: --max-turns 120 --allowedTools "Bash,Read,Glob,Grep,Write"
          prompt: |
            You are the nightly QA for Nalarupa (repo ${{ github.repository }}, branch ${{ github.ref_name }}).
            The Rust core is already built; app deps are installed. Read README.md (Checks) and core/guide/*.md first.

            1. Run the checks and note every failure:
               cd core && cargo test --release
               cd app && bun run typecheck && bun run smoke && bun run editor-check && bun run mcp-check && bun run doc-check
               cd app && bash scripts/wl-run.sh bun run e2e && bash scripts/wl-run.sh bun run file-e2e   (GPU window under headless Wayland; screenshots in app/screenshots/)
               Skip a11y-check, window-check, exe-check (Windows only) and editor-e2e (known Linux gap).
            2. Exploratory QA: write throwaway scripts under $RUNNER_TEMP (never in the repo) that drive the core
               through app/src/core.ts `call(...)` or the MCP server at http://127.0.0.1:47700/mcp. Probe edge cases:
               empty/huge documents, odd unicode text, deep nesting, auto layout extremes, undo/redo chains,
               invalid MCP/execute input, HTML/PDF export. Look at e2e screenshots (Read them) for visual defects.
            3. For each real, reproducible bug: search first with `gh issue list --state open --label bug --search "<keywords>"`.
               If it is not already filed, `gh issue create --label bug --title "<short>" --body "<repro steps, expected, actual, logs>"`.
               At most 5 new issues per run; no issues for style opinions or things you could not reproduce.
            Do not edit tracked files, commit, or push. End with a short summary of what you ran and filed.
