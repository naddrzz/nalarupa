name: claude
# Label an issue "claude" (bug or feature) to get a PR; mention @claude in an issue/PR comment or review to iterate.
# Only users with write access can trigger it (claude-code-action default).
on:
  issues: { types: [labeled, assigned] }
  issue_comment: { types: [created] }
  pull_request_review_comment: { types: [created] }
  pull_request_review: { types: [submitted] }

env:
  CARGO_TARGET_DIR: /home/nalarupa-ci/.cache/nalarupa-target
  NALARUPA_CORE: /home/nalarupa-ci/.cache/nalarupa-target/release/libnalarupa_core.so

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: [self-hosted, nalarupa]
    timeout-minutes: 120
    permissions: { contents: write, pull-requests: write, issues: write, id-token: write, actions: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: cargo build --release
        working-directory: core
      - run: bun install --frozen-lockfile
        working-directory: app
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          base_branch: dev
          branch_prefix: claude/
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 150
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
            --append-system-prompt "Nalarupa repo. Fix bugs at the root cause; keep diffs small and in the style of the surrounding code. Before finishing, run: (cd core && cargo test --release) && (cd app && bun run typecheck && bun run smoke && bun run editor-check && bun run mcp-check && bun run doc-check && bash scripts/wl-run.sh bun run e2e && bash scripts/wl-run.sh bun run file-e2e). Add or extend a check for every bug fix. Windows-only checks (a11y-check, window-check, exe-check) and editor-e2e cannot run here; say so in the PR. Open the PR against dev and reference the issue."
