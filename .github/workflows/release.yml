name: release
# Release builds for Windows (NSIS installer + portable zip), macOS (Apple Silicon .app in a .dmg) and Linux
# (x64 tarball). GPUIX ships its renderer addon for win32-x64, linux-x64-gnu and darwin-arm64 only, so those are
# the targets.
#
# Versions are automatic: a push to main (main moves only for a release) takes the latest v* tag, bumps its minor
# number, stamps it into the build (packaging/set-version.sh), builds all three, then tags the commit and attaches
# the files to a draft GitHub Release for the maintainer to publish. A manual run picks the bump (patch, minor or
# major) and whether to publish. A tag pushed by hand releases that version. Pull requests that touch the
# packaging only build.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "packaging/**", "app/scripts/package.ts"]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump from the latest v* tag
        type: choice
        options: [minor, patch, major]
        default: minor
      publish:
        description: Tag the commit and draft a GitHub Release
        type: boolean
        default: false

permissions: { contents: read }

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - id: v
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'minor' }}
          PUBLISH_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          plain='^[0-9]+\.[0-9]+\.[0-9]+$'
          # A pushed tag is the version; so is a v* tag already on this commit (a re-run, or a hand tag on main).
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -1)
            version=${version#v}
          fi
          if [ -z "$version" ]; then
            # Plain x.y.z only: the Windows installer's version resource needs numeric parts.
            last=$(git tag --list 'v*' --sort=-v:refname | sed 's/^v//' | grep -E "$plain" | head -1)
            IFS=. read -r major minor patch <<< "${last:-0.0.0}"
            case $BUMP in
              major) version=$((major + 1)).0.0 ;;
              minor) version=$major.$((minor + 1)).0 ;;
              patch) version=$major.$minor.$((patch + 1)) ;;
            esac
            echo "latest tag v${last:-none}, $BUMP bump"
          fi
          [[ $version =~ $plain ]] || { echo "::error::version '$version' is not plain x.y.z"; exit 1; }
          publish=false
          if [ "$GITHUB_EVENT_NAME" = push ] || [ "$PUBLISH_INPUT" = true ]; then publish=true; fi
          echo "Version $version (publish: $publish)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    # windows-2022 lists NSIS 3.10 among its preinstalled tools (actions/runner-images).
    runs-on: windows-2022
    timeout-minutes: 60
    defaults: { run: { shell: bash } }
    env: { VERSION: "${{ needs.version.outputs.version }}" }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.3 }
      - run: sh packaging/set-version.sh "$VERSION"
      - run: cargo build --release
        working-directory: core
      - run: bun install --frozen-lockfile && bun run build
        working-directory: app
      # Launch the compiled exe once before shipping it.
      - run: bun run exe-check
        working-directory: app
        timeout-minutes: 10
      - name: Installer
        run: |
          makensis=$(command -v makensis || echo "/c/Program Files (x86)/NSIS/makensis.exe")
          mkdir -p out
          "$makensis" -V2 "-DVERSION=$VERSION" "-DDIST=$(cygpath -w "$PWD/app/dist")" \
            "-DOUT=$(cygpath -w "$PWD/out/Nalarupa-$VERSION-windows-x64-setup.exe")" packaging/windows/installer.nsi
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path app/dist/* -DestinationPath "out/Nalarupa-$env:VERSION-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/*, if-no-files-found: error }

  macos:
    needs: version
    # Apple Silicon: GPUIX has no darwin-x64 addon.
    runs-on: macos-14
    timeout-minutes: 60
    env: { VERSION: "${{ needs.version.outputs.version }}" }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.3 }
      - run: sh packaging/set-version.sh "$VERSION"
      - run: cargo build --release
        working-directory: core
      - run: bun install --frozen-lockfile && bun run build
        working-directory: app
      # Launch the compiled binary once before shipping it.
      - run: bun run exe-check
        working-directory: app
        timeout-minutes: 10
      - name: App bundle
        run: |
          app=out/Nalarupa.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          # The exe finds the core and the addon next to itself (app/main.ts, app/src/core.ts).
          cp app/dist/* "$app/Contents/MacOS/"
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          set=$(mktemp -d)/Nalarupa.iconset
          mkdir -p "$set"
          b=app/assets/brand
          for s in 16 32 128 256 512; do
            cp "$b/icon-$s.png" "$set/icon_${s}x${s}.png"
            cp "$b/icon-$((s * 2)).png" "$set/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns "$set" -o "$app/Contents/Resources/Nalarupa.icns"
          # Ad-hoc signature: arm64 code must be signed to run. Not notarized, so the first open needs
          # right-click > Open (or System Settings > Privacy & Security > Open Anyway).
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
      - name: Disk image
        run: |
          stage=$(mktemp -d)
          cp -R out/Nalarupa.app "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Nalarupa $VERSION" -srcfolder "$stage" -format UDZO -ov "out/Nalarupa-$VERSION-macos-arm64.dmg"
          rm -rf out/Nalarupa.app
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: out/*, if-no-files-found: error }

  linux:
    needs: version
    # The oldest maintained runner: its glibc is what the binary needs at minimum, so older is wider.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env: { VERSION: "${{ needs.version.outputs.version }}" }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.3 }
      - run: sh packaging/set-version.sh "$VERSION"
      - run: cargo build --release
        working-directory: core
      - run: bun install --frozen-lockfile && bun run build
        working-directory: app
      - name: Tarball
        run: |
          name=Nalarupa-$VERSION-linux-x64
          mkdir -p "out/$name"
          cp app/dist/* "out/$name/"
          cp app/assets/brand/icon-256.png "out/$name/nalarupa.png"
          cp packaging/linux/nalarupa.desktop packaging/linux/install.sh "out/$name/"
          chmod +x "out/$name/install.sh" "out/$name/nalarupa"
          tar -C out -czf "out/$name.tar.gz" "$name"
          rm -rf "out/$name"
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: out/*, if-no-files-found: error }

  release:
    # Builds passed: now tag the commit (unless it is a pushed tag already) and draft the release.
    if: needs.version.outputs.publish == 'true'
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    env: { GH_TOKEN: "${{ github.token }}", VERSION: "${{ needs.version.outputs.version }}", TAG: "v${{ needs.version.outputs.version }}" }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      # A tag pushed with the workflow token starts no new workflow run, so this does not release twice.
      - name: Tag
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG exists"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
            echo "tagged $GITHUB_SHA as $TAG"
          fi
      - name: Draft release
        run: |
          cat > notes.md <<EOF
          Nalarupa $VERSION

          - **Windows (x64):** \`Nalarupa-$VERSION-windows-x64-setup.exe\` installs for all users; the portable zip runs from any folder.
          - **macOS 13+ (Apple Silicon):** open the \`.dmg\` and drag Nalarupa to Applications. The app is not notarized: the first time, right-click it and choose Open.
          - **Linux (x64):** unpack the tarball, \`cd\` into its folder and run \`./install.sh\` (installs to \`~/.local\`), or run \`./nalarupa\` in place. Needs a Wayland session and Vulkan drivers.
          EOF
          # A re-run of the same version refreshes the existing release's files instead of failing on a second create.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --draft --title "Nalarupa $VERSION" --notes-file notes.md --generate-notes
          fi
