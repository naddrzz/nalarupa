<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deck</title>

<style>*{box-sizing:border-box;margin:0;padding:0}body{display:flex;flex-direction:column;align-items:center;gap:40px;padding:40px 0;background:#f4f4f5}</style>
</head>
<body>
<div data-name="Picture" data-id="s3" style="position:relative;width:200px;height:120px;background:linear-gradient(#f4f4f5,#f4f4f5);display:flex;flex-direction:row;gap:10px;justify-content:flex-start;align-items:flex-start;padding:10px 10px 10px 10px;">
<div data-name="rectangle" data-id="photo" style="width:80px;flex-shrink:0;height:80px;background:url('pic.png') center/cover no-repeat;">
</div>
<div data-name="rectangle" data-id="card" style="width:60px;flex-shrink:0;height:40px;background:linear-gradient(#ffffff,#ffffff);border-radius:8px 8px 8px 8px;position:relative;isolation:isolate;">
<div style="position:absolute;z-index:-1;pointer-events:none;inset:-1px;border-radius:9px 9px 9px 9px;box-shadow:inset 0 0 0 2px #2563eb;"></div>
</div>
</div>
</body>
</html>
