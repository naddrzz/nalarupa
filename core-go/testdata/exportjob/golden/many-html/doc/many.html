<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deck</title>

<style>*{box-sizing:border-box;margin:0;padding:0}body{display:flex;flex-direction:column;align-items:center;gap:40px;padding:40px 0;background:#f4f4f5}</style>
</head>
<body>
<div data-name="Cover" style="position:relative;width:200px;height:120px;background:linear-gradient(#0f1115,#0f1115);overflow:hidden;">
<div data-name="rectangle" style="position:absolute;left:20px;top:20px;width:120px;height:24px;background:linear-gradient(#ff6a3d,#ff6a3d);border-radius:6px 6px 6px 6px;">
</div>
<div data-name="ellipse" style="position:absolute;left:140px;top:60px;width:40px;height:40px;background:linear-gradient(-90deg,#2563eb 0%,#22c55e 100%);border-radius:50%;">
</div>
<div data-name="rectangle" style="position:absolute;left:20px;top:90px;width:100px;height:8px;opacity:0.5;background:linear-gradient(#f4f1ea,#f4f1ea);">
</div>
</div>
<div data-name="Picture" style="position:relative;width:200px;height:120px;background:linear-gradient(#f4f4f5,#f4f4f5);display:flex;flex-direction:row;gap:10px;justify-content:flex-start;align-items:flex-start;padding:10px 10px 10px 10px;">
<div data-name="rectangle" style="width:80px;flex-shrink:0;height:80px;background:url('pic.png') center/cover no-repeat;">
</div>
<div data-name="rectangle" style="width:60px;flex-shrink:0;height:40px;background:linear-gradient(#ffffff,#ffffff);border-radius:8px 8px 8px 8px;position:relative;isolation:isolate;">
<div style="position:absolute;z-index:-1;pointer-events:none;inset:-1px;border-radius:9px 9px 9px 9px;box-shadow:inset 0 0 0 2px #2563eb;"></div>
</div>
</div>
<div data-name="rectangle" style="position:relative;width:60px;height:30px;background:linear-gradient(#22c55e,#22c55e);">
</div>
</body>
</html>
