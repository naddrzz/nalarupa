<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>layout</title>

<style>*{box-sizing:border-box;margin:0;padding:0}body{display:flex;flex-direction:column;align-items:center;gap:40px;padding:40px 0;background:#f4f4f5}</style>
</head>
<body>
<div style="position:relative;flex-shrink:0;width:120px;height:60px;">
<div data-name="frame" style="position:absolute;left:120px;top:0px;width:120px;height:60px;transform:scale(-1,1);transform-origin:0px 0px;background:linear-gradient(#ffcc00,#ffcc00);display:flex;flex-direction:row;justify-content:flex-start;align-items:flex-start;">
<div data-name="rectangle" style="width:30px;flex-shrink:0;height:30px;background:linear-gradient(#000000,#000000);">
</div>
</div>
</div>
</body>
</html>
