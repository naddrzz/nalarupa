<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>layout</title>

<style>*{box-sizing:border-box;margin:0;padding:0}body{display:flex;flex-direction:column;align-items:center;gap:40px;padding:40px 0;background:#f4f4f5}</style>
</head>
<body>
<div data-name="frame" style="position:relative;width:400px;height:fit-content;background:linear-gradient(#f4f4f5,#f4f4f5);display:flex;flex-direction:column;gap:12px;justify-content:flex-start;align-items:center;padding:16px 24px 16px 24px;">
<div data-name="frame" style="align-self:stretch;height:60px;flex-shrink:0;background:linear-gradient(#ffffff,#ffffff);display:flex;flex-direction:row;justify-content:space-between;align-items:flex-end;flex-shrink:0;padding:6px 6px 6px 6px;">
<div data-name="rectangle" style="width:40px;flex-shrink:0;height:30px;background:linear-gradient(#ee3333,#ee3333);">
</div>
<div data-name="rectangle" style="flex:1 1 0;min-width:0;min-height:0;align-self:stretch;background:linear-gradient(#33aa33,#33aa33);">
</div>
<div style="position:relative;flex-shrink:0;width:40.980762px;height:40.980762px;">
<div data-name="ellipse" style="position:absolute;left:0px;top:15px;width:30px;height:30px;transform:rotate(-30deg);transform-origin:0px 0px;background:linear-gradient(#3333ee,#3333ee);border-radius:50%;">
</div>
</div>
<div style="position:relative;flex-shrink:0;width:20px;height:40px;">
<div data-name="rectangle" style="position:absolute;left:0px;top:40px;width:20px;height:40px;transform:scale(1,-1);transform-origin:0px 0px;background:linear-gradient(#ffaa00,#ffaa00);">
</div>
</div>
</div>
<div data-name="frame" style="display:flex;flex-direction:row;gap:4px;justify-content:center;align-items:flex-start;flex-shrink:0;padding:2px 4px 6px 8px;">
<div data-name="rectangle" style="width:50px;flex-shrink:0;height:20px;background:linear-gradient(#00aaaa,#00aaaa);">
</div>
<div data-name="frame" style="width:30px;flex-shrink:0;height:30px;background:linear-gradient(#aa00aa,#aa00aa);position:relative;">
</div>
</div>
<div data-name="frame" style="width:110px;display:flex;flex-direction:column;gap:6px;justify-content:flex-start;align-items:flex-start;flex-shrink:0;padding:10px 10px 10px 10px;">
<div data-name="rectangle" style="align-self:stretch;height:10px;flex-shrink:0;background:linear-gradient(#999999,#999999);">
</div>
<div data-name="rectangle" style="width:90px;height:20px;flex-shrink:0;background:linear-gradient(#555555,#555555);">
</div>
</div>
<div data-name="frame" style="width:200px;height:80px;flex-shrink:0;background:linear-gradient(#eeeeee,#eeeeee);position:relative;overflow:hidden;">
<div data-name="rectangle" style="position:absolute;left:10px;top:10px;width:50px;height:100%;background:linear-gradient(#cc3333,#cc3333);">
</div>
<div data-name="group" style="position:absolute;left:160px;top:40px;transform:rotate(-15deg);transform-origin:-80px -20px;width:40px;height:30px;">
<div data-name="rectangle" style="position:absolute;left:0px;top:0px;width:30px;height:20px;background:linear-gradient(#3366cc,#3366cc);">
</div>
<div data-name="ellipse" style="position:absolute;left:40px;top:10px;width:20px;height:20px;transform:scale(-1,1);transform-origin:0px 0px;background:linear-gradient(#66cc33,#66cc33);border-radius:50%;">
</div>
</div>
</div>
<div data-name="frame" style="width:300px;height:40px;flex-shrink:0;display:flex;flex-direction:row;justify-content:flex-start;align-items:flex-start;flex-shrink:0;">
<div data-name="rectangle" style="position:absolute;left:5px;top:5px;width:60px;flex-shrink:0;height:20px;background:linear-gradient(#112233,#112233);">
</div>
<div data-name="rectangle" style="width:400px;flex-shrink:0;height:20px;opacity:0.5;background:linear-gradient(#445566,#445566);">
</div>
<div data-name="frame" style="width:fit-content;align-self:stretch;display:flex;flex-direction:column;justify-content:space-around;align-items:flex-start;flex-shrink:0;">
<div data-name="rectangle" style="width:10px;height:10px;flex-shrink:0;background:linear-gradient(#778899,#778899);">
</div>
</div>
</div>
</div>
</body>
</html>
