<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200">
  <defs>
    <filter id="iir" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2 0.6"/></filter>
    <filter id="box" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="mixed" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0.03 4"/></filter>
    <filter id="srgb" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="6" dy="4" stdDeviation="3" flood-color="#204" flood-opacity="0.7"/></filter>
    <filter id="shadow2" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB"><feDropShadow dx="-3" dy="5" stdDeviation="1" flood-color="#f80"/></filter>
  </defs>
  <rect width="320" height="200" fill="#fff"/>
  <g filter="url(#iir)"><rect x="15" y="15" width="50" height="40" fill="#c03"/><path d="M20 70 L70 70" stroke="#000" stroke-width="2"/></g>
  <circle cx="120" cy="40" r="25" fill="#06c" fill-opacity="0.8" filter="url(#box)"/>
  <rect x="180" y="15" width="40" height="50" fill="#393" filter="url(#mixed)" transform="rotate(25 200 40)"/>
  <ellipse cx="275" cy="40" rx="30" ry="20" fill="#f0f" filter="url(#srgb)"/>
  <g transform="translate(60 140) rotate(35) scale(1.3 0.8)"><rect x="-30" y="-20" width="60" height="40" fill="#fc0" filter="url(#shadow)"/></g>
  <g transform="translate(170 140) scale(-1 1)"><rect x="-30" y="-20" width="60" height="40" rx="8" fill="#0cf" filter="url(#shadow2)"/></g>
  <g transform="translate(260 140) skewX(20)"><circle r="25" fill="#7a3" filter="url(#shadow)"/></g>
</svg>
