<svg xmlns="http://www.w3.org/2000/svg" width="200" height="160" viewBox="0 0 200 160">
  <defs>
    <filter id="big" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="off" x="-1" y="-1" width="3" height="3"><feOffset dx="40" dy="30"/></filter>
    <clipPath id="c"><rect x="20" y="20" width="160" height="120" rx="10"/></clipPath>
  </defs>
  <rect width="200" height="160" fill="#fff"/>
  <g clip-path="url(#c)" opacity="0.9">
    <g opacity="0.7" style="mix-blend-mode:multiply"><circle cx="60" cy="60" r="70" fill="#f80" filter="url(#big)"/></g>
    <g opacity="0.5"><rect x="-500" y="70" width="1200" height="20" fill="#08f"/></g>
    <g filter="url(#off)"><rect x="150" y="110" width="80" height="80" fill="#0a0"/></g>
  </g>
  <g transform="translate(-150 -100)" opacity="0.6"><rect x="140" y="90" width="40" height="40" fill="#a0a"/></g>
  <g filter="url(#big)" transform="translate(190 150)"><rect width="300" height="300" fill="#000"/></g>
</svg>
