<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <defs><rect id="hidden-src" width="10" height="10" display="none"/><g id="gsrc" style="display:none"><rect width="5" height="5"/></g></defs>
  <g display="none"><rect id="in-hidden-g" width="50" height="50"/></g>
  <rect id="self-hidden" x="20" width="10" height="10" display="none"/>
  <g display="inline"><rect id="shown" x="40" width="10" height="10" display="block"/></g>
  <use id="use-hidden-src" href="#hidden-src" y="20"/>
  <use id="use-gsrc" href="#gsrc" y="40"/>
  <use id="use-none" href="#shown" y="60" display="none"/>
  <svg display="none" width="10" height="10"><rect width="5" height="5"/></svg>
</svg>
