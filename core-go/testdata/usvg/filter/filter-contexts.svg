<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200">
  <defs>
    <filter id="f1"><feGaussianBlur stdDeviation="1"/></filter>
    <g id="sym"><rect width="20" height="20" fill="red" filter="url(#f1)"/></g>
    <pattern id="p" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="10" filter="url(#f1)"/></pattern>
    <mask id="m"><rect width="200" height="200" fill="white" filter="url(#f1)"/></mask>
    <clipPath id="c"><rect width="100" height="100" filter="url(#f1)"/></clipPath>
    <marker id="mk" markerWidth="10" markerHeight="10"><rect width="5" height="5" filter="url(#f1)"/></marker>
  </defs>
  <use xlink:href="#sym" x="10" y="10"/>
  <use xlink:href="#sym" x="40" y="10" filter="url(#f1)"/>
  <rect x="70" y="10" width="80" height="80" fill="url(#p)"/>
  <rect x="10" y="100" width="50" height="50" fill="blue" mask="url(#m)"/>
  <rect x="70" y="100" width="50" height="50" fill="blue" clip-path="url(#c)"/>
  <path d="M130 110 L180 150" stroke="black" marker-end="url(#mk)"/>
  <svg x="150" y="10" width="40" height="40" viewBox="0 0 10 10" filter="url(#f1)"><rect width="10" height="10"/></svg>
</svg>
