<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200">
  <rect x="10" y="10" width="50" height="40" fill="blue" filter="blur(2px) drop-shadow(3px 4px 2px rgba(0,0,0,0.5)) grayscale(50%)"/>
  <rect x="70" y="10" width="50" height="40" fill="blue" filter="brightness(1.5) contrast(200%) invert(0.25)"/>
  <rect x="130" y="10" width="50" height="40" fill="blue" filter="opacity(40%) sepia(1) saturate(3)"/>
  <rect x="10" y="60" width="50" height="40" fill="blue" filter="hue-rotate(90deg) hue-rotate(1rad) hue-rotate(0.25turn) hue-rotate(50grad)"/>
  <rect x="70" y="60" width="50" height="40" fill="blue" filter="grayscale(2) sepia(150%) invert(3) opacity(5)"/>
  <rect x="130" y="60" width="50" height="40" fill="blue" filter="grayscale() sepia() saturate() brightness() contrast() invert() opacity() hue-rotate() blur()"/>
</svg>
