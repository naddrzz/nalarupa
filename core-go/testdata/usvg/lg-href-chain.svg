<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="100">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f00"/><stop offset="1" stop-color="#00f"/></linearGradient>
    <linearGradient id="vertical" href="#base" x2="0" y2="1"/>
    <linearGradient id="user" xlink:href="#vertical" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="60" y2="10"/>
    <linearGradient id="user-inherit" href="#user" spreadMethod="reflect"/>
    <linearGradient id="own-stops" href="#base"><stop offset="0.5" stop-color="#0f0"/><stop offset="1" stop-color="#000"/></linearGradient>
    <linearGradient id="to-missing" href="#nope" x2="0.5"><stop offset="0" stop-color="#ff0"/><stop offset="1" stop-color="#0ff"/></linearGradient>
    <linearGradient id="loop-a" href="#loop-b"><stop offset="0" stop-color="#123"/><stop offset="1" stop-color="#456"/></linearGradient>
    <linearGradient id="loop-b" href="#loop-a"/>
  </defs>
  <rect id="r-base" x="5" y="5" width="40" height="30" fill="url(#base)"/>
  <rect id="r-vertical" x="50" y="5" width="40" height="30" fill="url(#vertical)"/>
  <rect id="r-user" x="95" y="5" width="40" height="30" fill="url(#user)"/>
  <rect id="r-user-inherit" x="140" y="5" width="40" height="30" fill="url(#user-inherit)"/>
  <rect id="r-own" x="5" y="50" width="40" height="30" fill="url(#own-stops)"/>
  <rect id="r-missing" x="50" y="50" width="40" height="30" fill="url(#to-missing)"/>
  <rect id="r-loop" x="95" y="50" width="40" height="30" fill="url(#loop-b)"/>
  <rect id="r-stroke" x="140" y="50" width="40" height="30" fill="none" stroke="url(#base)" stroke-width="4"/>
</svg>
