<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100">
  <defs>
    <mask id="alpha" mask-type="alpha"><rect width="200" height="100" fill="#000" fill-opacity="0.5"/></mask>
    <mask id="alpha-css" style="mask-type:alpha"><rect width="200" height="100" fill="#f00"/></mask>
    <mask id="base"><rect x="0" y="0" width="100" height="100" fill="#fff"/></mask>
    <mask id="masked" mask="url(#base)"><circle cx="100" cy="30" r="25" fill="#fff"/></mask>
    <mask id="inner"><rect x="140" y="0" width="20" height="100" fill="#fff"/></mask>
    <mask id="content-masked"><g mask="url(#inner)"><rect width="200" height="100" fill="#fff"/></g></mask>
    <mask id="self" mask="url(#self)"><rect width="200" height="100" fill="#fff"/></mask>
  </defs>
  <rect id="r-alpha" x="5" y="5" width="40" height="30" fill="#c00" mask="url(#alpha)"/>
  <rect id="r-alpha-css" x="5" y="50" width="40" height="30" fill="#c0c" mask="url(#alpha-css)"/>
  <rect id="r-masked" x="50" y="5" width="90" height="50" fill="#0a0" mask="url(#masked)"/>
  <rect id="r-content-masked" x="120" y="5" width="70" height="50" fill="#00c" mask="url(#content-masked)"/>
  <rect id="r-self" x="50" y="60" width="40" height="30" mask="url(#self)"/>
</svg>
