<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100">
  <rect id="op" width="10" height="10" opacity="0.5"/>
  <rect id="op-pct" x="15" width="10" height="10" opacity="25%"/>
  <rect id="op-over" x="30" width="10" height="10" opacity="3"/>
  <rect id="op-neg" x="45" width="10" height="10" opacity="-1"/>
  <g id="gop" opacity="0.3"><rect x="60" width="10" height="10"/><rect x="75" width="10" height="10"/></g>
  <rect id="mul" y="20" width="10" height="10" style="mix-blend-mode: multiply"/>
  <rect id="scr" x="15" y="20" width="10" height="10" mix-blend-mode="screen"/>
  <g id="iso" style="isolation:isolate"><rect id="cd" x="30" y="20" width="10" height="10" style="mix-blend-mode:color-dodge"/></g>
  <g id="lum" style="mix-blend-mode:luminosity; isolation:auto"><rect x="45" y="20" width="10" height="10"/></g>
  <rect id="bad" x="60" y="20" width="10" height="10" style="mix-blend-mode:plus-lighter"/>
  <rect id="hl" x="75" y="20" width="10" height="10" style="mix-blend-mode:hard-light"/>
</svg>
