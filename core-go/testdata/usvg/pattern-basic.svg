<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100">
  <defs>
    <pattern id="obb" width="0.25" height="0.5"><rect width="5" height="5" fill="#c00"/></pattern>
    <pattern id="user" patternUnits="userSpaceOnUse" x="5" y="5" width="10" height="10"><circle cx="5" cy="5" r="4" fill="#0a0"/></pattern>
    <pattern id="content-obb" width="0.5" height="0.5" patternContentUnits="objectBoundingBox"><rect width="0.25" height="0.25" fill="#00a"/></pattern>
    <pattern id="viewbox" patternUnits="userSpaceOnUse" width="20" height="10" viewBox="0 0 10 10" preserveAspectRatio="xMaxYMid meet"><rect width="10" height="10" fill="#a0a"/></pattern>
    <pattern id="viewbox-cu" width="0.5" height="0.5" viewBox="0 0 4 4" patternContentUnits="objectBoundingBox"><rect width="2" height="2" fill="#0aa"/></pattern>
    <pattern id="zero-size" width="0" height="10"><rect width="5" height="5"/></pattern>
    <pattern id="empty" width="10" height="10" patternUnits="userSpaceOnUse"/>
  </defs>
  <rect id="r-obb" x="5" y="5" width="40" height="30" fill="url(#obb)"/>
  <rect id="r-user" x="50" y="5" width="40" height="30" fill="url(#user)"/>
  <rect id="r-content-obb" x="95" y="5" width="40" height="30" fill="url(#content-obb)"/>
  <rect id="r-viewbox" x="140" y="5" width="40" height="30" fill="url(#viewbox)"/>
  <rect id="r-viewbox-cu" x="5" y="50" width="40" height="30" fill="url(#viewbox-cu)"/>
  <rect id="r-zero" x="50" y="50" width="40" height="30" fill="url(#zero-size)"/>
  <rect id="r-empty" x="95" y="50" width="40" height="30" fill="url(#empty)" stroke="url(#user)"/>
</svg>
