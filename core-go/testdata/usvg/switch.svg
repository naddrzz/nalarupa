<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <switch id="sw1">
    <rect id="fr" systemLanguage="fr" width="10" height="10" fill="#f00"/>
    <rect id="en" systemLanguage="de, en-US" width="20" height="10" fill="#0f0"/>
    <rect id="fallback" width="30" height="10" fill="#00f"/>
  </switch>
  <switch id="sw2">
    <rect id="ext" requiredExtensions="http://example.org/x" y="20" width="10" height="10"/>
    <rect id="feat" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Shape" y="20" width="20" height="10" fill="#0a0"/>
  </switch>
  <switch id="sw3">
    <foo id="unknown" y="40"/>
    <g id="g-first" opacity="0.5"><rect y="40" width="10" height="10"/></g>
    <rect id="never" y="40" width="40" height="10"/>
  </switch>
  <switch id="sw4"><rect id="empty-ext" requiredExtensions="" y="60" width="10" height="10"/><rect id="lang-empty" systemLanguage="" y="60" width="20" height="10"/></switch>
  <switch id="sw5"><rect id="lang-prefix" systemLanguage="en-GB" y="80" width="10" height="10"/><rect id="after" y="80" width="20" height="10"/></switch>
</svg>
