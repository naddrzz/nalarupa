  <use id="d" href="#s-max" x="150" y="0" width="40" height="40"/>
  <use id="e" href="#s-midslice" x="200" y="0" width="40" height="40"/>
  <use id="f" href="#s" x="0" y="50"/>
  <use id="g" href="#s-noview" x="50" y="50"/>
  <use id="h" href="#s" x="100" y="50" width="0" height="40"/>
</svg>
