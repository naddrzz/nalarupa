[package]
name = "nalarupa-core"
version = "0.1.0"
edition = "2021"
description = "Nalarupa design engine: .pen-compatible document model, layout, renderer, JS execute sandbox, MCP server and agent"
license = "MIT"

[lib]
name = "nalarupa_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nalarupa-cli"
path = "src/bin/cli.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
resvg = "0.47"
ttf-parser = "0.25"
# Same shaper version usvg 0.47 uses, so measured widths match what resvg draws.
rustybuzz = "0.20"
unicode-linebreak = "0.1"
svgtypes = "0.15"
rquickjs = { version = "0.14.0", features = ["parallel"] }
ureq = { version = "3", features = ["json"] }
tiny_http = "0.12"
base64 = "0.22"
dirs = "6"
# PDF: krilla-svg 0.8 draws usvg 0.47 trees (keep resvg, krilla-svg and usvg in step).
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
krilla-svg = "0.8.1"
jpeg-encoder = "0.7"
image-webp = "0.1"
# Canvas rasterizer (resvg stays as per-subtree fallback, export renderer and test oracle).
vello_cpu = { version = "0.3.0", default-features = false, features = ["std", "u8_pipeline"] }
# Shader fills: WebGL fragment shaders rewritten to GLSL 450, compiled by naga, run on an offscreen device.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "metal", "wgsl", "naga-ir"] }
naga = { version = "30.0.1", features = ["glsl-in", "spv-out"] }
pollster = "0.4"
png = "0.18"
# Figma clipboard archives: raw-deflate (schema) and zstd (newer message chunks).
miniz_oxide = "0.8"
zstd = { version = "0.13", default-features = false }

# resvg 0.47.0 (Apache-2.0 OR MIT) with two fixes in src/render.rs: group layers (and filter
# regions) are clamped to their own target pixmap. Upstream clamps nested layers to a box in
# root-canvas coordinates, which drops content when painting small bands/tiles and wastes memory.
# tiny-skia 0.12.0 (BSD-3-Clause) with one fix in src/pipeline/highp.rs: ClipColor of the non-separable
# blend modes (hue, saturation, color, luminosity) never clipped a negative channel, so exports differed
# from the canvas.
[patch.crates-io]
resvg = { path = "vendor/resvg" }
# usvg 0.47.0 (Apache-2.0 OR MIT) with one fix in src/text/layout.rs: code point lookups are
# precomputed per text chunk, so laying out one very long line is linear instead of quadratic.
usvg = { path = "vendor/usvg" }
tiny-skia = { path = "vendor/tiny-skia" }

[profile.release]
opt-level = 3
debug = false

[profile.dev.package."*"]
opt-level = 2
